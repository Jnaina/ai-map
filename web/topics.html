<meta property="og:type" content="website">

<meta property="og:title" content="AI News by Topic — Jag's AI Heat Map">
<meta property="og:description" content="Every AI news article that fed Jag's AI Heat Map over the last 90 days, grouped by topic.">
<meta property="og:url" content="https://ai-news.jagular.io/topics.html">
<meta property="og:image" content="https://ai-news.jagular.io/og-image.png">

<meta name="theme-color" content="#3b82f6">
<style>
  /* Topic-specific bits layered on top of the shared Articles styling. */
  .src .favtile.topicon { background: var(--accent-soft, rgba(255,74,28,.1)); color: var(--accent, #ff4a1c); font-weight: 700; }
  /* Type group headers in the sidebar: the topic list is grouped by type (Company, Concept, …),
     alphabetical within each group, so each topic no longer needs its own type chip. */
  .grouphead {
    font-size: 10px; text-transform: uppercase; letter-spacing: .12em; font-weight: 700;
    color: var(--mid); padding: 14px 14px 5px; position: sticky; top: 0;
    background: var(--bg); border-bottom: 1px solid var(--faint);
  }
  /* The type chip is kept only in the right-pane header, to name the selected topic's type. */
  .ttype {
    font-size: 11px; text-transform: lowercase; letter-spacing: .02em; opacity: .62;
    padding: 1px 6px; border: 1px solid var(--line, #cfcecb); border-radius: 999px; white-space: nowrap;
  }
  #listHead .ttype { margin-left: 8px; vertical-align: 1px; }
</style>
</head>
<body>
<header id="bar">
  <div class="brand">
    <h1>JAG'S AI HEAT MAP</h1>
    <span class="tag">by topic · last 90 days</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Filter topics or headlines…" autocomplete="off" aria-label="Filter topics or headlines">
    <a class="maplink" href="articles.html">By source</a>
    <a class="maplink" href="index.html">← Map</a>
  </div>
</header>

<main id="wrap">
  <aside id="sources" aria-label="Topics">
    <nav id="srcNav"></nav>
  </aside>
  <section id="list" aria-live="polite">
    <div id="listHead"></div>
    <ol id="articles"></ol>
    <p id="empty" hidden>No articles.</p>
  </section>
</main>

<script src="topics.js?v=3"></script>
</body>
</html>
