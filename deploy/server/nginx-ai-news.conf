# Jag's AI Map (static site rebuilt hourly by ai-map-refresh.timer)
server {
    listen 80;
    listen [::]:80;
    server_name ai-news.jagular.io;
    root /opt/ai-map/web;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location /data/ { add_header Cache-Control "no-cache"; }
    location ~ /\. { return 404; }
}
