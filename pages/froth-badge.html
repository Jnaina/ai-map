<!-- Jag's AI Frothiness Index badge (data: frothiness.jagular.io/data/badge.json, refreshed daily) -->
<a id="froth" href="https://frothiness.jagular.io/" target="_blank" rel="noopener" hidden aria-label="Jag's AI Frothiness Index">
  <svg class="fz-spark" viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true"><path/></svg>
  <span class="fz-num"></span>
  <span class="fz-chg"></span>
  <span class="fz-lbl">AI Frothiness</span>
</a>
<style>
#froth{position:fixed;right:24px;bottom:96px;z-index:4;width:112px;height:112px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-decoration:none;color:var(--ink);
  font-family:var(--mono);background:var(--glass-solid);border:2px solid #e8743b;box-shadow:0 0 0 4px rgba(232,116,59,.12),var(--glass-shadow);
  -webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
  transition:transform .2s ease,box-shadow .2s ease}
#froth:hover{transform:translateY(-2px);border-color:#d9622b;box-shadow:0 0 0 6px rgba(232,116,59,.2),0 10px 28px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.55)}
#froth:focus-visible{outline:2px solid #d9622b;outline-offset:3px}
#froth .fz-spark{width:58px;height:14px;overflow:visible}
#froth .fz-spark path{fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.75}
#froth .fz-num{font-size:30px;font-weight:600;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
#froth .fz-chg{font-size:10px;color:var(--mid);line-height:1.2;font-variant-numeric:tabular-nums}
#froth .fz-lbl{font-size:8.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mid);margin-top:2px}
@media (max-width:760px){#froth{right:12px;bottom:14px;width:84px;height:84px}#froth .fz-num{font-size:22px}#froth .fz-spark{width:44px;height:10px}#froth .fz-lbl{font-size:7px;letter-spacing:.8px}}
</style>
<script>
(function(){
  var el=document.getElementById('froth');
  var COL={Calm:'#3f9b6e',Warm:'#c99a1e',Frothy:'#e0752f',Bubble:'#c73b3b'};
  function place(){var lg=document.getElementById('legend');
    if(lg&&getComputedStyle(lg).display!=='none'){el.style.bottom=(lg.getBoundingClientRect().height+24)+'px'}else{el.style.bottom=''}}
  fetch('https://frothiness.jagular.io/data/badge.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(b){
    var col=COL[b.band]||'var(--ink)';
    el.querySelector('.fz-num').textContent=Number(b.score).toFixed(1);
    el.querySelector('.fz-num').style.color=col;
    var d=b.d7, a=Math.abs(d)<0.5?'→ flat':(d>0?'▲ ':'▼ ')+Math.abs(d).toFixed(1);
    el.querySelector('.fz-chg').textContent=b.band+' · '+a+(Math.abs(d)<0.5?'':' wk');
    var s=b.spark||[]; if(s.length>1){var lo=Math.min.apply(null,s),hi=Math.max.apply(null,s),rg=(hi-lo)||1,p='';
      s.forEach(function(v,i){p+=(i?'L':'M')+(i/(s.length-1)*100).toFixed(1)+' '+(24-(v-lo)/rg*22).toFixed(1)});
      var path=el.querySelector('.fz-spark path');path.setAttribute('d',p);path.style.stroke=col}
    el.title="Jag's AI Frothiness Index: "+b.score+' ('+b.band+') on '+b.date+'. '+(d>0?'+':'')+d+' vs a week ago. Click for details.';
    el.hidden=false;place();
  }).catch(function(){});
  addEventListener('resize',place);setTimeout(place,1500);
})();
</script>
